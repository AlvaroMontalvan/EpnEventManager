name: CI - epn-event-manager

on:
  push:
    branches: [main, develop]
    paths:
      - 'epn-event-manager/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'epn-event-manager/**'

defaults:
  run:
    working-directory: epn-event-manager

jobs:
  pipeline:
    name: Lint -> Build -> Test -> Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: epn-event-manager/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests + coverage check (min. 80%)
        run: npm run test:cov
